name: Deploy

on:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend CI
        run: |
          cd backend
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Frontend CI
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy-backend:
    name: Deploy Backend
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Webhook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    name: Deploy Frontend
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Frontend Deployment Notification
        run: echo "Frontend auto-deploys via Vercel integration upon push to main."
